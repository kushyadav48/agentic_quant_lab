name: Phase 24 CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Prepare candidate artifact after all checks (no release publication)
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  QUANTLAB_CLOUD_ENABLED: 'false'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  LANGSMITH_TRACING: 'false'

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - run: python -m pip install -r requirements/build.txt
      - run: python -m pip install --no-build-isolation -c requirements/constraints.txt -e '.[dev]' -r requirements/ci.txt
      - run: python -m pip check
      - run: python scripts/check_environment.py
      - run: python scripts/check_secrets.py
      - run: python scripts/check_workflows.py
      - run: python -m pip_audit --progress-spinner off
      - run: git diff --check

  regression:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - run: python -m pip install -r requirements/build.txt
      - run: python -m pip install --no-build-isolation -c requirements/constraints.txt -e '.[dev]'
      - name: Authoritative full offline Python suite
        run: python -m pytest -q --junitxml=tmp/regression.xml

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - run: python -m pip install -r requirements/build.txt
      - run: python -m pip install --no-build-isolation -c requirements/constraints.txt -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest tests/deployment tests/api/test_lifecycle.py tests/persistence/test_recovery_defects.py -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements/build.txt
      - run: python -m pip install --no-build-isolation -c requirements/constraints.txt -e '.[dev]'
      - run: npm install --global npm@11.6.2
      - run: npm ci
        working-directory: frontend
      - run: python frontend/scripts/export_contracts.py
      - run: npm run contracts:check
        working-directory: frontend
      - name: Fail on schema, types or deterministic fixture drift
        run: git diff --exit-code -- frontend/contracts frontend/src/api/generated.ts frontend/src/test/fixtures.json frontend/src/debugger/offline.json
      - run: npm test
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: npm ls --all
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/build_dashboard.py
      - run: python -m pytest tests/deployment/test_production.py -q
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: python scripts/package_release.py --check-build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-build-inputs
          path: |
            dist/*.whl
            frontend/dist/
          if-no-files-found: error
          retention-days: 7

  release-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_release
    needs: [validation, regression, windows, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-build-inputs
      - run: python scripts/package_release.py --ci-run-url "$CI_RUN_URL"
        env:
          CI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: local-release-candidate
          path: dist/quantlab-candidate-*
          if-no-files-found: error
          retention-days: 7
