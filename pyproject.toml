[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-quant-lab"
version = "0.1.0"
description = "Foundation for an AI-assisted quantitative research and paper-trading platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "langgraph>=1.2.12,<2", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantlab", "quantlab.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
